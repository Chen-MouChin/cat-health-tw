name: Deploy to GitHub Pages

# 發佈 frontend/ 到 GitHub Pages。
# 目前 repo（private）沒開 Pages：2026-09-29 決定先內部開發、用 ngrok 測試，不公開，
# 所以不在 push 時自動部署，免得每次合併到 main 都失敗、寄通知。要上線時：
#   1. repo Settings → Pages → Source 選 GitHub Actions（private repo 需 GitHub Pro；或改用其他託管）
#   2. 把 push 觸發加回來：push: branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新的取代排隊中的舊的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # frontend/ 已是建好的靜態站，直接發佈（不在 CI 跑 build.py）
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend
      - id: deployment
        uses: actions/deploy-pages@v4
