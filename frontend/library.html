<style>
/* 文獻庫｜共用外殼在 site.css。內容區用「醫學期刊」排版：標題與摘要襯線體、書目式的作者／來源／年份。 */
.lib-col { max-width: 820px; margin: 0 auto; }
.page-head { position: relative; }
.page-head .lede { max-width: 36em; }
.lang-toggle { position: absolute; top: 4px; right: 0; display: flex; gap: 6px; }
.lang-toggle button { min-height: 36px; padding: 0 12px; border: 0; border-radius: var(--r-pill); background: var(--gold-pale); color: var(--text); font: 600 14px var(--ui); cursor: pointer; }
.lang-toggle button.active { background: var(--primary); color: var(--accent-on); }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.stat { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 14px; border-radius: var(--r-pill); background: var(--primary-pale); font-size: 14px; color: var(--text-2); }
.stat strong { font-size: 18px; color: var(--primary-deep); font-variant-numeric: tabular-nums; }

.controls { margin: 0 0 12px; }
.controls .field { width: 100%; }

.filter-group { margin: 0 0 10px; border: 1px solid var(--border-strong); border-radius: 14px; background: var(--bg-card); overflow: hidden; }
.filter-header { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; cursor: pointer; user-select: none; font-size: 16px; font-weight: 700; }
.filter-header:hover { background: var(--primary-pale); }
.filter-header .label { color: var(--text); }
.filter-header .count { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--text-muted); }
.filter-header .arrow { font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
.filter-group.open .arrow { transform: rotate(90deg); }
.filter-body { display: none; flex-wrap: wrap; gap: 8px; padding: 2px 14px 14px; }
.filter-group.open .filter-body { display: flex; }
.filter-btn { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border: 0; border-radius: var(--r-pill); background: var(--gold-pale); color: var(--text); font: 600 14px/1.2 var(--ui); cursor: pointer; white-space: nowrap; }
.filter-btn:hover { background: var(--gold-pale-deep); }
.filter-btn.active { background: var(--primary); color: var(--accent-on); }

.hint { margin: 12px 0 10px; font-size: 15px; color: var(--text-2); }
.clear-btn { margin-left: 8px; color: var(--primary); font-weight: 600; text-decoration: underline; cursor: pointer; }

/* 文獻卡片 */
.card { margin: 0 0 12px; padding: 16px 18px; border: 1px solid var(--border-strong); border-radius: var(--r-card); background: var(--bg-card); }
.card-header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.cid { font-family: ui-monospace, "Consolas", monospace; font-size: 12px; color: var(--text-muted); margin-right: 4px; }
.badge { display: inline-flex; align-items: center; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; line-height: 1.75; }
.badge-approved { background: var(--primary-pale); color: var(--primary-deep); }
.badge-pending { background: var(--gold-pale); color: var(--draft-text); }
.badge-rejected { background: var(--accent-light); color: var(--text-2); }
.badge-oa, .badge-verified { background: var(--primary-pale); color: var(--primary-deep); }
.badge-paid, .badge-untranslated, .badge-no-abstract { background: var(--accent-light); color: var(--text-2); }
.badge-cited { background: var(--bg-card); color: var(--primary-deep); box-shadow: inset 0 0 0 1px var(--primary); cursor: pointer; }
.badge-cited:hover { background: var(--primary); color: var(--accent-on); }
.card-title { font-family: var(--serif); font-size: 18px; font-weight: 700; line-height: 1.45; }
.card-title-zh { margin-top: 2px; font-family: var(--serif); font-size: 15px; color: var(--text-2); }
.card-meta { margin: 6px 0 0; font-size: 13px; color: var(--text-muted); }
.card-abstract { position: relative; margin: 10px 0 0; padding: 10px 14px; max-height: 9.5em; overflow: hidden; border-left: 3px solid var(--gold); border-radius: 0 10px 10px 0; background: var(--gold-pale); font-family: var(--serif); font-size: 15px; line-height: 1.75; white-space: pre-wrap; cursor: pointer; transition: max-height 0.3s; }
.card-abstract.expanded { max-height: 9999px; }
.card-abstract::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.2em; background: linear-gradient(transparent, var(--gold-pale)); pointer-events: none; }
.card-abstract.expanded::after { display: none; }
.card-keywords { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.keyword { padding: 0 10px; border-radius: var(--r-pill); background: var(--primary-pale); color: var(--primary-deep); font-size: 13px; line-height: 1.9; cursor: pointer; }
.keyword:hover { background: var(--primary); color: var(--accent-on); }
.card-link { margin-top: 10px; font-size: 14px; }
.card-link a { font-weight: 700; word-break: break-all; }
.card-link .i { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; color: var(--text-muted); }
.cited-by { margin: 10px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--primary-pale); font-size: 14px; }
.cited-by-label { margin-bottom: 4px; font-size: 13px; color: var(--text-muted); }
.cited-by ul { margin: 0; padding-left: 1.2em; }
.card.citation-highlight { animation: citeHighlight 3s ease-out; }
@keyframes citeHighlight { 0% { box-shadow: 0 0 0 3px var(--focus); } 100% { box-shadow: none; } }

/* 專業術語庫 */
.terms-body { display: none; padding: 4px 14px 14px; }
.filter-group.open .terms-body { display: block; }
.term-cat-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.term-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 700px) { .term-grid { grid-template-columns: 1fr 1fr; } }
.term-card { padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); cursor: pointer; }
.term-card:hover { border-color: var(--primary); }
.term-card.highlight { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-pale); }
.term-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.term-key { font-family: ui-monospace, "Consolas", monospace; font-size: 16px; font-weight: 700; color: var(--primary-deep); }
.term-cat { padding: 0 8px; border-radius: 6px; background: var(--accent-light); color: var(--text-2); font-size: 12px; font-weight: 700; line-height: 1.75; }
.term-full { margin-top: 2px; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.term-def { margin-top: 6px; font-size: 15px; line-height: 1.7; }
.term-points { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-strong); }
.term-card.expanded .term-points { display: block; }
.term-points ul { margin: 0; padding-left: 1.2em; font-size: 14px; color: var(--text-2); line-height: 1.7; }
.term-related { margin-top: 6px; font-size: 13px; color: var(--text-muted); }
.term-related a { font-weight: 600; cursor: pointer; }
.term-tag { border-bottom: 1px dashed var(--primary); cursor: help; }
.term-tag:hover { background: var(--primary-pale); }

@media (min-width: 880px) {
  .card-title { font-size: 19px; }
}
</style>

<script>
// ─────────────────────────────────────────────────────────────
// i18n
// ─────────────────────────────────────────────────────────────
const I18N = {

    cat_all: 'All', term_more: 'Expand ▼', term_less: 'Collapse ▲',
    term_related: 'Related:',
    clear: 'Clear all', back_home: '← Home', footer_workflow: 'See workflow:',
    s_all: 'All', s_approved: 'Approved', s_pending: 'Pending', s_rejected: 'Rejected',
    no_results: 'No matching citations',
    badge_approved: 'Approved', badge_pending: 'Pending', badge_rejected: 'Rejected',
    badge_oa: 'Open Access', badge_paid: 'Paywall', badge_verified: 'URL ✓',
    badge_untranslated: 'No ZH', badge_no_abstract: 'No abstract',
    found: 'records',
    only_untranslated: 'Untranslated only', only_no_abstract: 'Missing abstract only',
  }
};

// 文獻類型對照（學術術語有國際標準，翻譯不會偏誤）
// 來源縮寫（AAFP/ISFM/IRIS...）已併入 glossary.json 的 organization/journal 分類
// → 統一在「📚 專業術語庫」維護，避免兩處重複
//
// data 中 source 別名 → glossary.json key 的映射（僅處理對不上的別名）
const SOURCE_KEY_MAP = {
  'JVMS (J-STAGE)': 'JVMS',
  'Applied Animal Behaviour Science': 'AABS',
  'iris-kidney.com': 'IRIS',
};

const TOPIC_LABELS = {
  zh: {
    ckd: '腎病 CKD', diabetes: '糖尿病', flutd: '下泌尿道', fip: '傳腹 FIP',
    hcm: '心臟病', hyperthyroidism: '甲亢', emergency: '急診', dental: '牙科',
    senior_care: '老貓照護', vaccination: '疫苗', felv: '貓白血病', fiv: '貓愛滋',
    behavior: '行為', enrichment: '環境豐富化', nutrition: '營養', pain: '疼痛',
    arthritis: '關節炎', palliative: '安寧', toxicology: '毒物', vet_visit: '看診',
    fluid_therapy: '輸液', regulation: '法規',
    taiwan: '台灣', law: '法規', breed: '品種', aki: '急性腎損傷', neutering: '結紮', mammary: '乳腺',
    cancer: '腫瘤', statistics: '統計', rabies: '狂犬病', genetic: '遺傳', orthopedic: '骨科',
    senior: '老貓', neurology: '神經',
  },
  en: {
    ckd: 'CKD', diabetes: 'Diabetes', flutd: 'FLUTD', fip: 'FIP',
    hcm: 'HCM Heart', hyperthyroidism: 'Hyperthyroid', emergency: 'Emergency', dental: 'Dental',
    senior_care: 'Senior', vaccination: 'Vaccination', felv: 'FeLV', fiv: 'FIV',
    behavior: 'Behavior', enrichment: 'Enrichment', nutrition: 'Nutrition', pain: 'Pain',
    arthritis: 'Arthritis', palliative: 'Palliative', toxicology: 'Toxicology', vet_visit: 'Vet Visit',
    fluid_therapy: 'Fluid Therapy', regulation: 'Regulation',
  }
};

let currentLang = localStorage.getItem('library_lang') || 'zh';

function t(key) { return I18N[currentLang][key] || key; }
function tt(key) { return TOPIC_LABELS[currentLang][key] || key; }

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (I18N[currentLang][key]) el.textContent = I18N[currentLang][key];
  });
  document.querySelectorAll('[data-i18n-attr]').forEach(el => {
    const [attr, key] = el.dataset.i18nAttr.split('|');
    if (I18N[currentLang][key]) el.setAttribute(attr, I18N[currentLang][key]);
  });
  document.documentElement.lang = currentLang === 'zh' ? 'zh-TW' : 'en';
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('library_lang', lang);
  document.getElementById('lang-zh').classList.toggle('active', lang === 'zh');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  applyI18n();
  buildFilters();
  if (Object.keys(glossary).length) buildTerms();
  render();
}

// ─────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────
let citations = {};
let glossary = {};
let termRegex = null; // 自動偵測摘要中的術語
let termCategoryFilter = 'all';
let filters = {
  status: 'all',
  sources: new Set(),
  topics: new Set(),
  languages: new Set(),
  types: new Set(),
  untranslated: false,
  noAbstract: false,
};

function toggleGroup(name) {
  document.querySelectorAll(`.filter-group[data-group="${name}"]`).forEach(g => g.classList.toggle('open'));
}

function clearFilters() {
  filters = { status:'all', sources:new Set(), topics:new Set(), languages:new Set(), types:new Set(), untranslated:false, noAbstract:false };
  document.getElementById('q').value = '';
  buildFilters();
  render();
}

// ─────────────────────────────────────────────────────────────
// Load
// ─────────────────────────────────────────────────────────────
async function load() {
  const [citResp, glossResp] = await Promise.all([
    fetch('./data/citations.json'),
    fetch('./data/glossary.json'),
  ]);
  const data = await citResp.json();
  delete data._meta;
  citations = data;

  const gdata = await glossResp.json();
  delete gdata._meta;
  glossary = gdata;
  buildTermRegex();

  const entries = Object.values(citations);
  document.getElementById('stat-total').textContent = entries.length;
  document.getElementById('stat-approved').textContent = entries.filter(e => e.status === 'approved').length;
  document.getElementById('stat-oa').textContent = entries.filter(e => e.open_access).length;

  let qTimer = null;  // 停止輸入 200ms 才重繪
  document.getElementById('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(render, 200); });

  // 從 URL ?q= 預填搜尋（首頁搜尋框跳轉用）
  const urlQ = new URL(location.href).searchParams.get('q');
  if (urlQ) document.getElementById('q').value = urlQ;

  applyI18n();
  buildFilters();
  buildTerms();
  render();
  openCitationFromURL();
}

function buildTermRegex() {
  // 收集所有術語別名（排除 citation_type — 那是 metadata，不該在摘要中亂標）
  const aliases = new Set();
  Object.entries(glossary).forEach(([k, g]) => {
    if (g.category !== 'citation_type') aliases.add(k);
  });
  Object.keys(SOURCE_KEY_MAP).forEach(k => aliases.add(k));
  // 按長度倒排，避免短詞先匹配（如 IRIS 不會被 IR 截斷）
  const sorted = [...aliases].sort((a, b) => b.length - a.length);
  const escaped = sorted.map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  termRegex = new RegExp('\\b(' + escaped.join('|') + ')\\b', 'g');
}

// 別名 → glossary key
function resolveTermKey(alias) {
  if (glossary[alias]) return alias;
  if (SOURCE_KEY_MAP[alias] && glossary[SOURCE_KEY_MAP[alias]]) return SOURCE_KEY_MAP[alias];
  return null;
}

function buildFilters() {
  const entries = Object.values(citations);

  // Status
  const sf = document.getElementById('filter-status');
  sf.innerHTML = '';
  ['all','approved','pending_review','rejected'].forEach(s => {
    const labelKey = {all:'s_all', approved:'s_approved', pending_review:'s_pending', rejected:'s_rejected'}[s];
    const cnt = s==='all' ? entries.length : entries.filter(e=>e.status===s).length;
    const b = mkBtn(`${t(labelKey)} (${cnt})`, filters.status===s);
    b.onclick = () => { filters.status = s; buildFilters(); render(); };
    sf.appendChild(b);
  });
  // 分隔
  const sep1 = document.createElement('span');
  sep1.style.cssText = 'color:#ccc;margin:0 0.3rem;font-size:0.75rem;align-self:center';
  sep1.textContent = '|';
  sf.appendChild(sep1);
  // 快速：未翻譯
  const untrCnt = entries.filter(e => !e.title_zh).length;
  const bUntr = mkBtn(`⏳ ${t('only_untranslated')} (${untrCnt})`, filters.untranslated);
  bUntr.onclick = () => { filters.untranslated = !filters.untranslated; buildFilters(); render(); };
  sf.appendChild(bUntr);
  // 快速：缺摘要
  const noAbsCnt = entries.filter(e => !e.abstract_zh).length;
  const bNoAbs = mkBtn(`📝 ${t('only_no_abstract')} (${noAbsCnt})`, filters.noAbstract);
  bNoAbs.onclick = () => { filters.noAbstract = !filters.noAbstract; buildFilters(); render(); };
  sf.appendChild(bNoAbs);

  // Source（多選）
  const srcCounts = {};
  entries.forEach(e => { srcCounts[e.source] = (srcCounts[e.source]||0)+1; });
  const sources = Object.entries(srcCounts).sort((a,b)=>b[1]-a[1]);
  const srcDiv = document.getElementById('filter-source');
  srcDiv.innerHTML = '';
  sources.forEach(([src, cnt]) => {
    const b = mkBtn(`${src} (${cnt})`, filters.sources.has(src));
    b.onclick = () => {
      filters.sources.has(src) ? filters.sources.delete(src) : filters.sources.add(src);
      buildFilters(); render();
    };
    srcDiv.appendChild(b);
  });

  // Topic（多選）
  const topicCounts = {};
  entries.forEach(e => (e.disease_tags||[]).forEach(t => { topicCounts[t] = (topicCounts[t]||0)+1; }));
  const topics = Object.entries(topicCounts).sort((a,b)=>b[1]-a[1]);
  const tDiv = document.getElementById('filter-topic');
  tDiv.innerHTML = '';
  topics.forEach(([topic, cnt]) => {
    const b = mkBtn(`${tt(topic)} (${cnt})`, filters.topics.has(topic));
    b.onclick = () => {
      filters.topics.has(topic) ? filters.topics.delete(topic) : filters.topics.add(topic);
      buildFilters(); render();
    };
    tDiv.appendChild(b);
  });

  // Meta: language + type（皆多選 + 點擊取消）
  const mDiv = document.getElementById('filter-meta');
  mDiv.innerHTML = '';
  const langs = [...new Set(entries.map(e=>e.language))].filter(Boolean).sort();
  const langLabel = {zh: {'en':'英文','zh-TW':'繁中','ja':'日文','zh':'中文'}, en: {'en':'English','zh-TW':'Traditional Chinese','ja':'Japanese','zh':'Chinese'}};
  langs.forEach(l => {
    const cnt = entries.filter(e=>e.language===l).length;
    const lbl = (langLabel[currentLang] && langLabel[currentLang][l]) || l;
    const b = mkBtn(`${lbl} (${cnt})`, filters.languages.has(l));
    b.onclick = () => {
      filters.languages.has(l) ? filters.languages.delete(l) : filters.languages.add(l);
      buildFilters(); render();
    };
    mDiv.appendChild(b);
  });
  // Separator
  const sep = document.createElement('span');
  sep.style.cssText = 'color:#ccc;margin:0 0.3rem;font-size:0.75rem;align-self:center';
  sep.textContent = '|';
  mDiv.appendChild(sep);
  const types = [...new Set(entries.map(e=>e.type))].filter(Boolean).sort();
  types.forEach(ty => {
    const cnt = entries.filter(e=>e.type===ty).length;
    const tg = glossary[ty]; // 文獻類型也在 glossary.json 中
    const lbl = tg ? (currentLang === 'zh' ? tg.full_zh : tg.full_en) : ty;
    const b = mkBtn(`${lbl} (${cnt})`, filters.types.has(ty));
    b.title = tg ? `${tg.full_en} / ${tg.full_zh}\n${tg.definition_zh || ''}` : ty;
    b.onclick = () => {
      filters.types.has(ty) ? filters.types.delete(ty) : filters.types.add(ty);
      buildFilters(); render();
    };
    mDiv.appendChild(b);
  });

  // Update counts in headers
  updateGroupCount('topic', filters.topics.size);
  updateGroupCount('source', filters.sources.size);
  updateGroupCount('status', (filters.status === 'all' ? 0 : 1) + (filters.untranslated?1:0) + (filters.noAbstract?1:0));
  updateGroupCount('meta', filters.languages.size + filters.types.size);

  // Show/hide clear button
  const hasFilters = filters.status!=='all' || filters.sources.size || filters.topics.size
                     || filters.languages.size || filters.types.size
                     || filters.untranslated || filters.noAbstract
                     || document.getElementById('q').value;
  document.getElementById('clear-btn').style.display = hasFilters ? 'inline' : 'none';
}

function updateGroupCount(name, n) {
  const el = document.getElementById(`count-${name}`);
  if (el) el.textContent = n > 0 ? `· ${n}` : '';
}

function buildTerms() {
  const container = document.getElementById('filter-terms');
  container.innerHTML = '';
  const entries = Object.entries(glossary);

  // Category counts
  const catCounts = {};
  entries.forEach(([_, g]) => { catCounts[g.category] = (catCounts[g.category]||0)+1; });
  const cats = ['all', ...Object.keys(catCounts).sort()];

  // Category bar
  const bar = document.createElement('div');
  bar.className = 'term-cat-bar';
  cats.forEach(c => {
    const lbl = c === 'all'
      ? `${t('cat_all')} (${entries.length})`
      : `${t('cat_' + c) || c} (${catCounts[c]})`;
    const b = mkBtn(lbl, termCategoryFilter === c);
    b.onclick = () => { termCategoryFilter = c; buildTerms(); };
    bar.appendChild(b);
  });
  container.appendChild(bar);

  // Term grid
  const grid = document.createElement('div');
  grid.className = 'term-grid';
  const filtered = entries.filter(([_, g]) =>
    termCategoryFilter === 'all' || g.category === termCategoryFilter
  );
  filtered.forEach(([key, g]) => grid.appendChild(renderTermCard(key, g)));
  container.appendChild(grid);

  document.getElementById('count-terms').textContent = `· ${entries.length}`;
}

function renderTermCard(key, g) {
  const card = document.createElement('div');
  card.className = 'term-card';
  card.id = `term-${key}`;
  const points = (g.key_points_zh || []).map(p => `<li>${escapeHtml(p)}</li>`).join('');
  const related = (g.related || []).map(r =>
    `<a data-term="${escapeHtml(r)}">${escapeHtml(r)}</a>`
  ).join(' · ');

  card.innerHTML = `
    <div class="term-head">
      <span class="term-key">${escapeHtml(g.term || key)}</span>
      <span class="term-cat ${g.category}">${escapeHtml(t('cat_' + g.category) || g.category)}</span>
    </div>
    <div class="term-full">${escapeHtml(g.full_en || '')} ｜ ${escapeHtml(g.full_zh || '')}</div>
    <div class="term-def">${escapeHtml(g.definition_zh || '')}</div>
    <div class="term-points">
      ${points ? `<ul>${points}</ul>` : ''}
      ${related ? `<div class="term-related">${t('term_related')} ${related}</div>` : ''}
    </div>
  `;
  card.onclick = (ev) => {
    if (ev.target.tagName === 'A' && ev.target.dataset.term) {
      ev.stopPropagation();
      jumpToTerm(ev.target.dataset.term);
      return;
    }
    card.classList.toggle('expanded');
  };
  return card;
}

function jumpToTerm(key) {
  if (!glossary[key]) return;
  // 開啟術語區
  const grp = document.querySelector('.filter-group[data-group="terms"]');
  if (grp && !grp.classList.contains('open')) grp.classList.add('open');
  // 切到該分類
  termCategoryFilter = glossary[key].category;
  buildTerms();
  setTimeout(() => {
    const el = document.getElementById(`term-${key}`);
    if (el) {
      el.classList.add('expanded', 'highlight');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => el.classList.remove('highlight'), 2000);
    }
  }, 50);
}

// 把摘要中出現的術語包成可點 tooltip
function highlightTerms(text) {
  if (!termRegex || !text) return escapeHtml(text || '');
  const escaped = escapeHtml(text);
  return escaped.replace(termRegex, (m) => {
    const key = resolveTermKey(m);
    if (!key) return m;
    const g = glossary[key];
    const tip = `${g.full_en} | ${g.full_zh}\n${g.definition_zh}`;
    return `<span class="term-tag" data-term="${escapeHtml(key)}" title="${escapeHtml(tip)}">${m}</span>`;
  });
}

function mkBtn(label, active) {
  const b = document.createElement('span');
  b.className = 'filter-btn' + (active ? ' active' : '');
  b.textContent = label;
  return b;
}

// ─────────────────────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────────────────────
function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let filtered = Object.entries(citations);

  if (filters.status !== 'all') {
    filtered = filtered.filter(([_, e]) => e.status === filters.status);
  }
  if (filters.sources.size) {
    filtered = filtered.filter(([_, e]) => filters.sources.has(e.source));
  }
  if (filters.topics.size) {
    filtered = filtered.filter(([_, e]) => (e.disease_tags||[]).some(t => filters.topics.has(t)));
  }
  if (filters.languages.size) {
    filtered = filtered.filter(([_, e]) => filters.languages.has(e.language));
  }
  if (filters.types.size) {
    filtered = filtered.filter(([_, e]) => filters.types.has(e.type));
  }
  if (filters.untranslated) {
    filtered = filtered.filter(([_, e]) => !e.title_zh);
  }
  if (filters.noAbstract) {
    filtered = filtered.filter(([_, e]) => !e.abstract_zh);
  }
  if (q) {
    filtered = filtered.filter(([cid, e]) => {
      const text = (cid + ' ' + (e.title||'') + ' ' + (e.title_zh||'') + ' ' + (e.abstract_zh||'') + ' ' + (e.keywords||[]).join(' ')).toLowerCase();
      return text.includes(q);
    });
  }

  filtered.sort(([, a], [, b]) => {
    const sa = a.status === 'approved' ? 0 : 1;
    const sb = b.status === 'approved' ? 0 : 1;
    if (sa !== sb) return sa - sb;
    return (b.year || 0) - (a.year || 0);
  });

  document.getElementById('hint-text').textContent = `${filtered.length} ${t('found')}`;
  buildFilters(); // refresh clear button state

  // 產卡片 + 每 10 筆插一張廣告卡（總筆數 > 10 才啟用）
  const cards = filtered.map(([cid, e]) => renderCard(cid, e));
  let html;
  if (cards.length > 10) {
    const interleaved = [];
    cards.forEach((card, i) => {
      interleaved.push(card);
      // 第 10、20、30... 之後插廣告，但最後一筆後不插
      if ((i + 1) % 10 === 0 && i < cards.length - 1) {
        interleaved.push(renderAdInFeed());
      }
    });
    html = interleaved.join('');
  } else {
    html = cards.join('');
  }
  document.getElementById('results').innerHTML = html || `<div class="hint">${t('no_results')}</div>`;

  document.querySelectorAll('.card-abstract').forEach(el => {
    el.onclick = (ev) => {
      // 點擊術語 tag → 跳到術語庫，不展開摘要
      if (ev.target.classList.contains('term-tag') && ev.target.dataset.term) {
        ev.stopPropagation();
        jumpToTerm(ev.target.dataset.term);
        return;
      }
      el.classList.toggle('expanded');
    };
  });
  document.querySelectorAll('.keyword[data-kw]').forEach(el => {
    el.onclick = () => {
      document.getElementById('q').value = el.dataset.kw;
      render();
    };
  });
}

function escapeHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 每 5 筆插一張廣告卡（同 banner ad unit，不同樣式）
function renderAdInFeed() {
  return '';  // AdSense 上線前不放佔位卡；上線後拿掉這行
  const lbl = currentLang === 'zh' ? '贊助' : 'Sponsored';
  return `
    <div class="ad-card-inline" data-ad-slot="banner">
      <div class="ad-label">${lbl}</div>
      <div class="ad-slot"><span>Ad Slot · in-feed (responsive)</span></div>
    </div>
  `;
}

function renderCard(cid, e) {
  const statusBadge = {
    approved: `<span class="badge badge-approved">${t('badge_approved')}</span>`,
    pending_review: `<span class="badge badge-pending">${t('badge_pending')}</span>`,
    rejected: `<span class="badge badge-rejected">${t('badge_rejected')}</span>`,
  }[e.status] || '';
  const oaBadge = e.open_access
    ? `<span class="badge badge-oa">${t('badge_oa')}</span>`
    : `<span class="badge badge-paid">${t('badge_paid')}</span>`;
  const verifiedBadge = e.url_verified ? `<span class="badge badge-verified">${t('badge_verified')}</span>` : '';
  const untranslatedBadge = (currentLang === 'zh' && !e.title_zh) ? `<span class="badge badge-untranslated">${t('badge_untranslated')}</span>` : '';
  const noAbstractBadge = !e.abstract_zh ? `<span class="badge badge-no-abstract">${t('badge_no_abstract')}</span>` : '';

  // cited_by badge + 展開列表
  const citedBy = e.cited_by || [];
  const citedBadge = citedBy.length
    ? `<span class="badge badge-cited" onclick="toggleCitedBy(event, '${cid}')" title="被 ${citedBy.length} 篇文章引用">${currentLang === 'zh' ? '被引用' : 'Cited'} ${citedBy.length}</span>`
    : '';

  const keywords = (e.keywords || []).map(k => `<span class="keyword" data-kw="${escapeHtml(k)}">${escapeHtml(k)}</span>`).join('');
  const journal = e.journal ? ` · ${escapeHtml(e.journal)}` : '';

  // 中英顯示策略：currentLang=zh 時優先 zh 標題，en 時用英文
  const primaryTitle = currentLang === 'zh' ? (e.title_zh || e.title) : e.title;
  const secondaryTitle = currentLang === 'zh'
    ? (e.title_zh && e.title_zh !== e.title ? e.title : '')
    : (e.title_zh || '');

  return `
    <div class="card" id="citation-${cid}" data-cid="${cid}">
      <div class="card-header">
        <span class="cid">${escapeHtml(cid)}</span>
        ${statusBadge} ${oaBadge} ${verifiedBadge} ${untranslatedBadge} ${noAbstractBadge} ${citedBadge}
      </div>
      <div class="card-title">${escapeHtml(primaryTitle || '')}</div>
      ${secondaryTitle ? `<div class="card-title-zh">${escapeHtml(secondaryTitle)}</div>` : ''}
      <div class="card-meta">${escapeHtml(e.authors || '')} · ${escapeHtml(e.source || '')}${journal} · ${e.year || ''}</div>
      ${e.abstract_zh ? `<div class="card-abstract">${highlightTerms(e.abstract_zh)}</div>` : ''}
      ${keywords ? `<div class="card-keywords">${keywords}</div>` : ''}
      ${citedBy.length ? `<div class="cited-by" id="cited-by-${cid}" hidden>${renderCitedByList(citedBy)}</div>` : ''}
      ${e.url ? `<div class="card-link"><svg class="i" aria-hidden="true"><use href="#i-link"/></svg><a href="${escapeHtml(e.url)}" target="_blank" rel="noopener">${currentLang === 'zh' ? '開啟原文' : 'Open source'}</a></div>` : ''}
    </div>
  `;
}

function renderCitedByList(slugs) {
  const label = currentLang === 'zh' ? '被以下文章引用：' : 'Cited by:';
  // 未審核的文章線上沒有頁面，只列 slug 不給連結
  const live = new Set((window.ARTICLES_INDEX || []).map(a => a.slug));
  const items = slugs.map(s => live.has(s)
    ? `<li><a href="articles/${escapeHtml(s)}.html" target="_blank" rel="noopener">${escapeHtml(s)}</a></li>`
    : `<li>${escapeHtml(s)}（審核中）</li>`).join('');
  return `<div class="cited-by-label">${label}</div><ul>${items}</ul>`;
}

function toggleCitedBy(ev, cid) {
  ev.stopPropagation();
  const el = document.getElementById('cited-by-' + cid);
  if (el) el.hidden = !el.hidden;
}

// ?id=XXX URL 深連結：自動捲動 + 高亮
function openCitationFromURL() {
  const id = new URL(location.href).searchParams.get('id');
  if (!id) return;
  // 需等 render 完
  setTimeout(() => {
    const el = document.getElementById('citation-' + id);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('citation-highlight');
      setTimeout(() => el.classList.remove('citation-highlight'), 3000);
    }
  }, 100);
}

setLang(currentLang);
load();
</script>
</body>
</html>
